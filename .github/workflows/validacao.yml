name: validacao

on:
  push:
  pull_request:

jobs:
  reproduzir-e-validar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Instalar dependências (poppler + jsonschema)
        run: |
          sudo apt-get update && sudo apt-get install -y poppler-utils
          pip install jsonschema
      - name: Guardar derivados commitados (para comparação)
        run: cp derivados/bncc.sql /tmp/bncc-commitado.sql
      - name: Extrair das fontes oficiais
        run: |
          cd pipeline
          python3 extrair.py
          python3 extrair_ei.py
      - name: Verificar contra o PDF homologado
        run: cd pipeline && python3 verificar.py
      - name: Validar contra os JSON Schemas (com autoteste negativo)
        run: cd pipeline && python3 validar_schema.py
      - name: Validar contratos e completude
        run: cd pipeline && python3 validar.py
      - name: Gerar derivados
        run: cd pipeline && python3 derivar.py
      - name: Dataset commitado = dataset reproduzido
        run: git diff --exit-code dados/ derivados/csv/ derivados/bncc.sql
      - name: SQLite commitado = SQLite reproduzido (dump lógico)
        run: diff /tmp/bncc-commitado.sql derivados/bncc.sql
